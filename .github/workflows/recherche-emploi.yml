name: Recherche d'emploi

on:
  schedule:
    - cron: "17 8,14,20 * * *"
      timezone: Europe/Zurich
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recherche-emploi
  cancel-in-progress: false

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Tester le filtrage et les parseurs
        run: python -m unittest -v

  rechercher:
    needs: tester
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        profile: [lettres, comptabilite, systemes]
    env:
      ADZUNA_ID: ${{ secrets.ADZUNA_ID }}
      ADZUNA_KEY: ${{ secrets.ADZUNA_KEY }}
      RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
      LINKEDIN_IMAP_HOST: ${{ secrets.LINKEDIN_IMAP_HOST }}
      LINKEDIN_IMAP_PORT: ${{ secrets.LINKEDIN_IMAP_PORT }}
      LINKEDIN_IMAP_USER: ${{ secrets.LINKEDIN_IMAP_USER }}
      LINKEDIN_IMAP_PASS: ${{ secrets.LINKEDIN_IMAP_PASS }}
      LINKEDIN_IMAP_FOLDER: ${{ secrets.LINKEDIN_IMAP_FOLDER }}
      LINKEDIN_ALERT_DEFAULT_LOCATION: ${{ secrets.LINKEDIN_ALERT_DEFAULT_LOCATION }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances et Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Restaurer l'historique du profil
        uses: actions/cache/restore@v4
        with:
          path: data/${{ matrix.profile }}
          key: find-job-data-${{ matrix.profile }}-${{ github.run_id }}
          restore-keys: |
            find-job-data-${{ matrix.profile }}-
      - name: Rechercher les offres
        run: python scraper.py --profile ${{ matrix.profile }}
      - name: Conserver l'historique du profil
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data/${{ matrix.profile }}
          key: find-job-data-${{ matrix.profile }}-${{ github.run_id }}
      - name: Préparer la publication et l'état récupérable
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: etat-${{ matrix.profile }}
          path: |
            data/${{ matrix.profile }}/seen_jobs.json
            data/${{ matrix.profile }}/all_jobs.json
            data/${{ matrix.profile }}/review_jobs.json
            data/${{ matrix.profile }}/health.json
            data/${{ matrix.profile }}/query_coverage.json
            data/${{ matrix.profile }}/rejections.json
            data/${{ matrix.profile }}/detail_cache.json
            docs/${{ matrix.profile }}
          if-no-files-found: error
          retention-days: 14
      - name: Résumé du profil
        if: always()
        run: echo "Profil ${{ matrix.profile }} — état ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  publier:
    needs: rechercher
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt
      - name: Réunir les trois profils
        uses: actions/download-artifact@v4
        with:
          pattern: etat-*
          merge-multiple: true
      - name: Régénérer le portail et le diagnostic global
        run: python -c "import scraper; scraper.generate_portal_index()"
      - name: Publier les rapports GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
          else
            git commit -m "Mise à jour automatique des offres $(date '+%Y-%m-%d %H:%M')"
            git push
          fi
